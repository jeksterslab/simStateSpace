name: R Package Test Coverage

on:
  workflow_run:
    workflows: [ "Make Project" ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      latest:
        description: "Run in the latest image and packages, not the lock's"
        type: boolean
        default: false

jobs:
  # the image and packages of the release (.setup/scripts/rproject.lock);
  # a scheduled run, or a manual run with latest, uses the latest
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lock.outputs.image }}
      snapshot: ${{ steps.lock.outputs.snapshot }}
      r_version: ${{ steps.lock.outputs.r_version }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .setup/scripts
      -
        name: Read the lock
        id: lock
        env:
          EVENT: ${{ github.event_name }}
          LATEST: ${{ inputs.latest }}
        run: bash .setup/scripts/image-lock.sh

  test-coverage:
    needs: image
    runs-on: ubuntu-latest
    env:
      RPROJECT_SNAPSHOT: ${{ needs.image.outputs.snapshot }}
      GITHUB_PAT: ${{ secrets.PAT }}
      GITHUB_ACTIONS: "true"
      GITHUB_TEST: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Pin packages to the lock's snapshot
        if: needs.image.outputs.snapshot != 'latest'
        shell: Rscript {0}
        run: |
          # R-devel keeps the latest packages: an old snapshot may not build there
          if (!grepl("devel|unstable", R.version$status, ignore.case = TRUE)) {
            repo <- "https://packagemanager.posit.co/cran/"
            if (Sys.info()[["sysname"]] == "Linux" && nzchar(Sys.which("lsb_release"))) {
              codename <- system2("lsb_release", "-cs", stdout = TRUE)
              repo <- paste0(repo, "__linux__/", codename, "/")
            }
            repo <- paste0(repo, Sys.getenv("RPROJECT_SNAPSHOT"))
            cat(
              sprintf("options(repos = c(CRAN = \"%s\"))\n", repo),
              file = path.expand("~/.Rprofile"),
              append = TRUE
            )
            message("Packages from ", repo)
          }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
