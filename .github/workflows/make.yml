name: Make Project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      latest:
        description: "Run in the latest image and packages, not the lock's"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:

  # the image and packages of the release (.setup/scripts/rproject.lock);
  # a scheduled run, or a manual run with latest, uses the latest
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lock.outputs.image }}
      snapshot: ${{ steps.lock.outputs.snapshot }}
      r_version: ${{ steps.lock.outputs.r_version }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .setup/scripts
      -
        name: Read the lock
        id: lock
        env:
          EVENT: ${{ github.event_name }}
          LATEST: ${{ inputs.latest }}
        run: bash .setup/scripts/image-lock.sh

  build:
    needs: image
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      RPROJECT_SNAPSHOT: ${{ needs.image.outputs.snapshot }}
      GITHUB_PAT: ${{ secrets.PAT }}
      GITHUB_ACTIONS: "true"
    permissions:
      contents: write
      packages: read
      statuses: write

    steps:
      -
        name: Checkout 
        uses: actions/checkout@v7
      -
        name: Clean
        run: |
          make clean
      -
        name: Make Project
        run: |
          make install
          make bibrproject
          make push
      - 
        name: Commit and push changes
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.PAT }}
          commit_message: "Automated build [skip ci]."