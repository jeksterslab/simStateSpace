name: Package Website (GitHub Pages)

on:
  workflow_run:
    workflows: [ "Make Project" ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      latest:
        description: "Run in the latest image and packages, not the lock's"
        type: boolean
        default: false

jobs:

  # the image and packages of the release (.setup/scripts/rproject.lock);
  # a scheduled run, or a manual run with latest, uses the latest
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lock.outputs.image }}
      snapshot: ${{ steps.lock.outputs.snapshot }}
      r_version: ${{ steps.lock.outputs.r_version }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .setup/scripts
      -
        name: Read the lock
        id: lock
        env:
          EVENT: ${{ github.event_name }}
          LATEST: ${{ inputs.latest }}
        run: bash .setup/scripts/image-lock.sh

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-gh-pages-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      RPROJECT_SNAPSHOT: ${{ needs.image.outputs.snapshot }}
      GITHUB_PAT: ${{ secrets.PAT }}
      GITHUB_ACTIONS: "true"
    permissions:
      contents: write

    steps:
      -
        name: Checkout 
        uses: actions/checkout@v7
      -
        name: Build Project
        run: make build
      -
        name: Build pkgdown Site
        run: make pkgdown
      -
        name: Add .nojekyll
        run: touch pkgdown/.nojekyll
      -
        name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: pkgdown
          folder: pkgdown
